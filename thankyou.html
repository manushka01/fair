<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thank You | Fairway Energy</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
background:#eafce5;
}

.hero{
background:linear-gradient(to bottom,#ecffe7,#e3fadf);
height:430px;
border-bottom-right-radius:220px;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
}

.logo{
width:260px;
margin-bottom:100px;
}

.logo img{
width:100%;
}

.thank-title{
font-size:70px;
font-weight:700;
color:#176b39;
margin-top:20px;
}

.content{
background:#2f8648;
color:#fff;
text-align:center;
padding:70px 20px;
}

.content h2{
font-size:55px;
font-weight:700;
line-height:1.35;
max-width:1100px;
margin:auto;
}

.content p{
font-size:28px;
margin-top:60px;
}

.team{
font-size:34px;
font-weight:bold;
margin-top:40px;
}

.home-btn{

margin-top:60px;
padding:18px 45px;
font-size:22px;
border:none;
border-radius:8px;
background:#ffd800;
cursor:pointer;
font-weight:bold;

}

.home-btn:hover{

background:#ffcb00;

}

@media(max-width:768px){

.hero{

height:280px;
border-bottom-right-radius:120px;

}

.logo{

width:180px;
margin-bottom:60px;

}

.thank-title{

font-size:40px;

}

.content h2{

font-size:28px;

}

.content p{

font-size:20px;

}

.team{

font-size:24px;

}

}

</style>

</head>

<body>

<div class="hero">


<h1 class="thank-title">Thank You!</h1>

</div>

<div class="content">

<h2>

We have received your application and one of our representatives
will be in touch very shortly to discuss your requirements in more detail.

</h2>

<p>

We look forward to speaking with you.

</p>

<p>

Many thanks,

</p>

<div class="team">

The Fairway Energy Team

</div>

<button class="home-btn"
onclick="window.location.href='index.html'">

Back To Home

</button>

</div>

</body>
</html>
